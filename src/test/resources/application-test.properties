# ====================集成测试配置====================
# 用H2内存库跑真实的Spring上下文，不依赖本机MySQL
# 注意spring.datasource.url会被测试断言校验（见ApplicationIntegrationTest），
# 用来防止测试意外连到真实数据库

spring.datasource.url=jdbc:h2:mem:rbac_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=test
spring.datasource.driver-class-name=org.h2.Driver

# 建表与种子数据照常执行，但显式指向H2专用脚本
# 不能沿用默认值：默认是 classpath*:schema.sql，会同时匹配到 main 和 test 下的两份，
# 导致建表和种子数据各跑两次，第二次主键冲突
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql

# 测试用签名密钥，至少32个字符
jwt.secret=integration-test-secret-key-1234567890
