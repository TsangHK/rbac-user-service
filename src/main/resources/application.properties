spring.application.name=rbac-user-service


# ====================本地配置====================
# 导入不进git的本地配置文件，用于放敏感信息；文件不存在时自动跳过
spring.config.import=optional:file:./application-local.properties


# ====================运行环境====================
# 未显式指定profile时使用dev（建表、写种子数据、打印SQL日志）
# 生产环境用环境变量覆盖：SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev


# ====================服务端口====================
# 只监听本机回环地址，避免接口暴露到局域网/公网
# 需要让同网段其他设备访问时改成0.0.0.0（注意种子账号密码是公开的）
server.address=127.0.0.1


# ====================数据库配置====================
# DB_PASSWORD必填；DB_URL、DB_USERNAME可选
# 用127.0.0.1而不是localhost：避免解析到IPv6的::1，连不上只监听IPv4回环的MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 建表与种子数据只在dev profile下执行，见application-dev.properties
spring.sql.init.encoding=UTF-8


# ====================JWT配置====================
# 签名密钥：必填，至少32个字符，由环境变量 JWT_SECRET 注入
jwt.secret=${JWT_SECRET:}
# Token有效期（毫秒），默认24小时
jwt.expiration-ms=86400000
