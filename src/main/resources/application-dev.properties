# ====================开发环境配置====================
# 未显式指定profile时通过 spring.profiles.default=dev 生效（见application.properties）
# 生产环境不要启用本文件的任何一项

# 启动时执行 schema.sql / data.sql：建表 + 写入初始账号（admin/123456、user/123456）
# 生产环境启用会把已知密码的管理员账号插进真实库，务必保持关闭
spring.sql.init.mode=always

# 打印SQL与参数到控制台，便于本地排查；含账号、密文等数据，生产环境必须关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
